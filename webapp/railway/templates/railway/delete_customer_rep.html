{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Delete Customer Representative</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<div class="container mt-4">
    <h2>Delete Customer Representative</h2>
    <p>Are you sure you want to delete {{ first_name }} {{ last_name }} (SSN: {{ ssn }})?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'admin:admin_account' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
