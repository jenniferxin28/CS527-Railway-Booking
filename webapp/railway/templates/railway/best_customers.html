{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Top 5 Best Customers</title>
</head>
<body>
<div class="container mt-4">
    <h2>Top 5 Best Customers by Revenue</h2>

    {% if top_customers %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Total Revenue</th>
                </tr>
            </thead>
            <tbody>
                {% for c in top_customers %}
                    <tr>
                        <td>{{ c.first_name }}</td>
                        <td>{{ c.last_name }}</td>
                        <td>{{ c.total_revenue }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No customer data found.</p>
    {% endif %}
</div>
</body>
</html>
