<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Unanswered Questions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        .question-item {
            margin-bottom: 15px;
        }
        .question-text {
            font-weight: bold;
            margin: 0;
            display: inline-block;
            margin-right: 10px;
        }
        .answer-form {
            display: none; /* Initially hidden */
            margin-top: 10px;
        }
        .answer-form input[type="text"] {
            width: 300px;
            padding: 6px;
            margin-right: 10px;
        }
        .answer-form button {
            padding: 6px 12px;
        }
    </style>
    <script>
        function showAnswerForm(questionId) {
            var form = document.getElementById('answer-form-' + questionId);
            if (form.style.display === 'none' || form.style.display === '') {
                form.style.display = 'block';
            } else {
                form.style.display = 'none';
            }
        }
    </script>
</head>
<body>
    <h1>Unanswered Questions</h1>
    {% if questions %}
        <ul>
            {% for q in questions %}
                <li class="question-item">
                    <span class="question-text">Q{{ q.id }}: {{ q.question }}</span>
                    <button type="button" onclick="showAnswerForm('{{ q.id }}')">Add Answer</button>
                    <form id="answer-form-{{ q.id }}" class="answer-form" method="POST" action="{% url 'railway:submit_answer' %}">
                        {% csrf_token %}
                        <input type="hidden" name="question_id" value="{{ q.id }}"/>
                        <input type="text" name="answer" placeholder="Type your answer..."/>
                        <button type="submit">Submit</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No unanswered questions found.</p>
    {% endif %}
</body>
</html>
