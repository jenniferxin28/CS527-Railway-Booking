{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Railway Booking - Register</title>
        {% include 'railway/components/header.html' with selected="" %}
    </head>
    <body>

        <div class="container d-flex align-items-center justify-content-center min-vh-100">
            <div class="card p-4 shadow-lg" style="width: 100%; max-width: 400px;">
                <h2 class="text-center mb-4">Register</h2>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" class="form-control" name="first_name" id="first_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input type="text" class="form-control" name="last_name" id="last_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="password" required>
                    </div>

                    {% if message %}
                        <div class="alert alert-warning mt-3">
                            {{ message }}
                        </div>
                    {% endif %}

                    <button type="submit" class="btn btn-primary w-100 mt-3" name="register">Register</button>
                </form>
                <div class="text-center mt-3">
                    <p>
                        Already have an account? 
                        <a href="{% url 'railway:index' %}">Sign in here</a>.
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
