{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Revenue by Transit Line</title>
</head>
<body>
<div class="container mt-4">
    <h2>Revenue by Transit Line</h2>

    {% if revenues %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Transit Line</th>
                    <th>Total Revenue</th>
                </tr>
            </thead>
            <tbody>
                {% for rev in revenues %}
                    <tr>
                        <td>{{ rev.transit_line_name }}</td>
                        <td>{{ rev.total_revenue }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>No revenue data found.</p>
    {% endif %}

    <div class="row">
        <a href="{% url 'railway:railway_admin' %}" class="btn btn-secondary mt-3">Return</a>
    </div>
</div>
</body>
</html>
